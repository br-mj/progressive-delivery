apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: orders-api-smoke
  namespace: progressive-delivery

spec:
  parentRefs:
    - name: orders-api-gateway
      sectionName: http

  hostnames:
    - orders-haproxy.test

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: orders-api
          port: 80