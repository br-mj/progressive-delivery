
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: argo-rollouts-gateway-api-plugin
  namespace: progressive-delivery

rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get

  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: argo-rollouts-gateway-api-plugin
  namespace: progressive-delivery

subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-rollouts-gateway-api-plugin
