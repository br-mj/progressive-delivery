
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: orders-api
  namespace: progressive-delivery

spec:
  ingressClassName: cloud-provider-kind

  rules:
    - host: orders.test

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: orders-api
                port:
                  number: 80
